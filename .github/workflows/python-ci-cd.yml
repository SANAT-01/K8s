# CI/CD pipeline for the demo Flask app in python-app/.
# Flow: lint + test -> build & push a Docker image to GHCR -> deploy to the dev k8s cluster.
name: Python App CI/CD

on:
  # Only run when python-app/ actually changes, so unrelated commits don't
  # trigger a rebuild/redeploy of this app.
  push:
    branches: [ "main" ]
    paths: [ "python-app/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "python-app/**" ]
  # Allows a manual run from the Actions tab regardless of the paths filter above.
  workflow_dispatch:

env:
  # Image lives in this repo's GitHub Container Registry namespace.
  IMAGE: ghcr.io/${{ github.repository_owner }}/python-demo-app

jobs:
  # Lint and unit-test the app before anything gets built or shipped.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python-app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 app.py test_app.py --max-line-length=100

      - name: Test
        run: pytest -v

  # Build the Docker image and push it to GHCR. Only runs once tests pass.
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Tag images with the short commit SHA so each build is traceable back to a commit.
      - id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN is auto-provisioned per run; no extra secret needed to push to GHCR.
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: python-app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/python-demo-app:latest

  # Roll the new image out to the dev cluster.
  deploy-dev:
    runs-on: self-hosted # must run where kubectl can reach your dev cluster
    needs: build-and-push
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to dev cluster
        run: |
          # k8s.yaml ships with a placeholder image ref; swap in the tag we just built and pushed.
          sed "s|ghcr.io/OWNER/python-demo-app:latest|${{ env.IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}|" \
            python-app/k8s.yaml | kubectl apply -f -
          kubectl rollout status deployment/python-app --timeout=90s
